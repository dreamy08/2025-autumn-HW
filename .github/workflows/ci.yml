name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make clang-format
      - name: Build
        run: make build
      - name: Run
        run: make run
      - name: Format check
        run: make format-check
